<!DOCTYPE html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Collections</title>

    <link rel='stylesheet' href='style.css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="side-decor left"></div>
<div class="side-decor right"></div>

<div class="container text-center">
    <h1>Collections</h1>
</div>

<hr />

<!-- SEARCH SECTION -->
<div class="container text-center">
    <div class="row">

        <div class="col-lg-6">
            <h3>Search Pokemon</h3>
            <div id="pokemon_search_error" class="hidden"></div>

            <input id='pokemon_name' placeholder="Name" />
            <input id='rarity' placeholder="Rarity" />
            <input id='number' placeholder="Number" />

            <select id="pokemon_order">
                <option value="">Order</option>
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
            </select>

            <input id="pokemon_limit" type="number" placeholder="Limit results" />

            <button id='search'>Search Pokemon</button>
        </div>

        <div class="col-lg-6">
            <h3>Search MTG</h3>
            <div id="mtg_search_error" class="hidden"></div>

            <input id='mtg_name' placeholder="Name" />
            <input id='mtg_supertype' placeholder="Supertype" />

            <select id='mtg_rarity'>
                <option value=''></option>
                <option value='common'>Common</option>
                <option value='uncommon'>Uncommon</option>
                <option value='rare'>Rare</option>
                <option value='mythic rare'>Mythic Rare</option>
            </select>

            <input id='card_number' placeholder="Card #" />

            <select id='is_foil'>
                <option value=''></option>
                <option value='1'>Yes</option>
                <option value='0'>No</option>
            </select>

            <select id="mtg_order">
                <option value="">Order</option>
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
            </select>

            <input id="mtg_limit" type="number" placeholder="Limit results" />

            <button id='mtg_search'>Search MTG</button>
        </div>

    </div>
</div>

<hr />

<!-- ADD POKEMON -->
<div class="container text-center">
    <h3>Add Pokemon</h3>
    <div id="pokemon_error_banner" class="hidden"></div>

    <input id='add_pokemon_name' placeholder="Name" required />
    <div class="error" id="err_add_pokemon_name"></div>

    <input id='add_pokemon_number' placeholder="Number" required />
    <div class="error" id="err_add_pokemon_number"></div>

    <input id='add_pokemon_rarity' placeholder="Rarity" required />
    <div class="error" id="err_add_pokemon_rarity"></div>

    <input id='add_pokemon_collection' placeholder="Collection ID" required />
    <div class="error" id="err_add_pokemon_collection"></div>

    <button id='add_pokemon_btn'>Add Pokemon</button>
</div>

<hr />

<!-- ADD MTG -->
<div class="container text-center">
    <h3>Add MTG Card</h3>
    <div id="mtg_error_banner" class="hidden"></div>

    <input id='add_mtg_name' placeholder="Name" required />
    <div class="error" id="err_add_mtg_name"></div>

    <input id='add_mtg_supertype' placeholder="Supertype" required />
    <div class="error" id="err_add_mtg_supertype"></div>

    <select id='add_mtg_rarity' required>
        <option value=''>Rarity</option>
        <option value='common'>Common</option>
        <option value='uncommon'>Uncommon</option>
        <option value='rare'>Rare</option>
        <option value='mythic rare'>Mythic Rare</option>
    </select>
    <div class="error" id="err_add_mtg_rarity"></div>

    <input id='add_mtg_number' placeholder="Card #" required />
    <div class="error" id="err_add_mtg_number"></div>

    <select id='add_is_foil' required>
        <option value=''>Foil?</option>
        <option value='1'>Yes</option>
        <option value='0'>No</option>
    </select>
    <div class="error" id="err_add_is_foil"></div>

    <input id='add_mtg_collection' placeholder="Collection ID" required />
    <div class="error" id="err_add_mtg_collection"></div>

    <button id='add_mtg_btn'>Add MTG Card</button>
</div>

<hr />

<!-- RESULTS -->
<div class="container">
    <h3>Pokemon Results</h3>
    <div id='pokemon_results'></div>

    <h3>MTG Results</h3>
    <div id='mtg_results'></div>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
    <h3>Edit Card</h3>

    <div id="edit_error_banner" class="hidden"></div>

    <input id="edit_id" type="hidden" />
    <input id="edit_type" type="hidden" />

    <div id="pokemon_edit_fields">
        <input id="edit_pokemon_name" placeholder="Name" />
        <input id="edit_pokemon_rarity" placeholder="Rarity" />
        <input id="edit_pokemon_number" placeholder="Number" />
    </div>

    <div id="mtg_edit_fields">
        <input id="edit_mtg_name" placeholder="Name" />
        <input id="edit_mtg_supertype" placeholder="Supertype" />
        <input id="edit_mtg_rarity" placeholder="Rarity" />
        <input id="edit_mtg_card_number" placeholder="Card #" />
        <select id="edit_is_foil">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>
    </div>

    <button id="update_btn">Update</button>
    <button id="close_btn">Close</button>
</div>

<script>
const $ = (id) => document.getElementById(id);

// error handler
function clearErrors(prefix) {
    document.querySelectorAll(`[id^="err_${prefix}"]`).forEach(e => e.innerText = "");
}

function showErrors(prefix, errors) {
    if (!errors) return;
    Object.keys(errors).forEach(k => {
        const el = $(`err_${prefix}${k}`);
        if (el) el.innerText = errors[k];
    });
}

function showBanner(id, message) {
    const el = $(id);
    if (!el) return;
    el.innerText = message;
    el.classList.remove("hidden");
}

function hideBanner(id) {
    const el = $(id);
    if (!el) return;
    el.classList.add("hidden");
}

// search pokemon
$("search").onclick = async () => {
    const params = new URLSearchParams();

    if ($("pokemon_name").value) params.append("pokemon_name", $("pokemon_name").value);
    if ($("rarity").value) params.append("rarity", $("rarity").value);
    if ($("number").value) params.append("number", $("number").value);
    if ($("pokemon_order").value) params.append("order", $("pokemon_order").value);
    if ($("pokemon_limit").value) params.append("limit", $("pokemon_limit").value);

    const res = await fetch("/collection/?" + params);
    const data = await res.json();

    display(data.data, "pokemon");
};

// search mtg
$("mtg_search").onclick = async () => {
    const params = new URLSearchParams();

    if ($("mtg_name").value) params.append("mtg_name", $("mtg_name").value);
    if ($("mtg_supertype").value) params.append("supertype", $("mtg_supertype").value);
    if ($("mtg_rarity").value) params.append("mtg_rarity", $("mtg_rarity").value);
    if ($("card_number").value) params.append("card_number", $("card_number").value);
    if ($("is_foil").value) params.append("is_foil", $("is_foil").value);
    if ($("mtg_order").value) params.append("order", $("mtg_order").value);
    if ($("mtg_limit").value) params.append("limit", $("mtg_limit").value);

    const res = await fetch("/magic/?" + params);
    const data = await res.json();

    display(data.data, "mtg");
};

// add pokemon
$("add_pokemon_btn").onclick = async () => {
    clearErrors("add_pokemon_");
    hideBanner("pokemon_error_banner");

    const name = $("add_pokemon_name").value.trim();
    const number = $("add_pokemon_number").value.trim();
    const rarity = $("add_pokemon_rarity").value.trim();
    const collection = $("add_pokemon_collection").value.trim();

    if (!name || !number || !rarity || !collection) {
        showBanner("pokemon_error_banner", "All fields are required");
        return;
    }

    const fd = new FormData();
    fd.append("pokemon_name", name);
    fd.append("number", number);
    fd.append("rarity", rarity);
    fd.append("collection_id", collection);

    const res = await fetch("/pokemon/insert", { method: "POST", body: fd });
    const data = await res.json();

    if (!res.ok) {
        showBanner("pokemon_error_banner", "Please fix errors below");
        return showErrors("add_pokemon_", data.errors);
    }

    alert(data.message);
};

// add mtg
$("add_mtg_btn").onclick = async () => {
    clearErrors("add_mtg_");
    hideBanner("mtg_error_banner");

    const name = $("add_mtg_name").value.trim();
    const supertype = $("add_mtg_supertype").value.trim();
    const rarity = $("add_mtg_rarity").value;
    const number = $("add_mtg_number").value.trim();
    const foil = $("add_is_foil").value;
    const collection = $("add_mtg_collection").value.trim();

    if (!name || !supertype || !rarity || !number || !foil || !collection) {
        showBanner("mtg_error_banner", "All fields are required");
        return;
    }

    const fd = new FormData();
    fd.append("mtg_name", name);
    fd.append("supertype", supertype);
    fd.append("mtg_rarity", rarity);
    fd.append("card_number", number);
    fd.append("is_foil", foil);
    fd.append("collection_id", collection);

    const res = await fetch("/magic/insert", { method: "POST", body: fd });
    const data = await res.json();

    if (!res.ok) {
        showBanner("mtg_error_banner", "Please fix errors below");
        return showErrors("add_mtg_", data.errors);
    }

    alert(data.message);
};

// display
function display(data, type) {
    let html = `<table class="table table-striped"><thead><tr>`;

    if (type === "pokemon") {
        html += `<th>Name</th><th>Rarity</th><th>Number</th>`;
    } else {
        html += `<th>Name</th><th>Supertype</th><th>Rarity</th><th>#</th>`;
    }

    html += `</tr></thead><tbody>`;

    if (data?.length) {
        data.forEach(r => {
            html += `<tr onclick='openEditor(${JSON.stringify(r)}, "${type}")'>`;

            if (type === "pokemon") {
                html += `<td>${r.pokemon_name}</td><td>${r.rarity}</td><td>${r.number}</td>`;
            } else {
                html += `<td>${r.mtg_name}</td><td>${r.supertype}</td><td>${r.mtg_rarity}</td><td>${r.card_number}</td>`;
            }

            html += `</tr>`;
        });
    } else {
        html += `<tr><td colspan="4">No results</td></tr>`;
    }

    html += `</tbody></table>`;
    $(type === "pokemon" ? "pokemon_results" : "mtg_results").innerHTML = html;
}

//editor
function openEditor(row, type) {
    $("sidebar").classList.add("open");
    $("edit_id").value = row.id;
    $("edit_type").value = type;
}

$("close_btn").onclick = () => $("sidebar").classList.remove("open");

// update
$("update_btn").onclick = async () => {
    const id = $("edit_id").value;
    const type = $("edit_type").value;

    const fd = new FormData();
    let url = "";

    if (type === "pokemon") {
        fd.append("pokemon_name", $("edit_pokemon_name").value);
        fd.append("rarity", $("edit_pokemon_rarity").value);
        fd.append("number", $("edit_pokemon_number").value);
        url = `/pokemon/update/${id}`;
    } else {
        fd.append("mtg_name", $("edit_mtg_name").value);
        fd.append("supertype", $("edit_mtg_supertype").value);
        fd.append("mtg_rarity", $("edit_mtg_rarity").value);
        fd.append("card_number", $("edit_mtg_card_number").value);
        fd.append("is_foil", $("edit_is_foil").value);
        url = `/magic/update/${id}`;
    }

    const res = await fetch(url, { method: "PUT", body: fd });
    const data = await res.json();

    alert(data.message || "Updated");
};
</script>

</body>
</html>
